services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:?Set values from .env.example in .env}
      MARIADB_USER: ${WORDPRESS_DB_USER:?Set values from .env.example in .env}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set a local database password in .env}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:?Set a local root password in .env}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15

  wordpress:
    build:
      context: ./apps/wordpress
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:?Set values from .env.example in .env}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?Set values from .env.example in .env}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?Set a local database password in .env}
      PORTFOLIO_WP_HOME: ${PORTFOLIO_WP_HOME:-http://localhost:8080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:?Set a local webhook secret in .env}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', getenv('PORTFOLIO_WP_HOME'));
        define('WP_SITEURL', getenv('PORTFOLIO_WP_HOME'));
        define('WP_ENVIRONMENT_TYPE', 'local');
        if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) { $_SERVER['HTTPS'] = 'on'; }
    volumes:
      - wordpress_data:/var/www/html
      - ./apps/wordpress/plugins/portfolio-studio:/var/www/html/wp-content/plugins/portfolio-studio:ro
      - media_data:/var/www/html/wp-content/uploads

volumes:
  database_data:
  wordpress_data:
  media_data:
