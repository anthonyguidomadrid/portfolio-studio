name: Feature or work item
description: Propose a bounded, reviewable implementation task
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this issue achieve, and for whom?
      placeholder: Describe the desired result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is in scope and explicitly list important exclusions.
      placeholder: In scope… / Out of scope…
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and contracts
      description: List prerequisite issues, API/schema decisions, and work that can safely happen in parallel.
      placeholder: None, or link dependencies and identify the agreed contract.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable criteria. Include accessibility or CMS behavior when relevant.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Name the commands or manual checks that will demonstrate completion.
      placeholder: |
        - npm --prefix apps/web run typecheck
        - npm --prefix apps/web run lint
        - npm --prefix apps/web run build
    validations:
      required: true
